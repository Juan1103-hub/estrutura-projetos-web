<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cartão de visita digital profissional">
  <meta name="theme-color" content="#1e293b">
  <title>Cartão de Visitas — Digital Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="container">
    <div id="loading" class="loading" role="status" aria-live="polite">
      <div id="spinner" class="loading-spinner" aria-hidden="true"></div>
      <p class="loading-text">Carregando cartão...</p>
    </div>

    <div id="error" class="error" hidden>
      <p class="error-message"></p>
      <button class="error-retry" type="button">Tentar novamente</button>
    </div>

    <main id="card" class="card" hidden>
      <header class="card__header">
        <img id="avatar" class="card__avatar" src="" alt="Foto de perfil" width="120" height="120">
        <h1 id="name" class="card__name"></h1>
        <p id="title" class="card__title"></p>
        <p id="company" class="card__company"></p>
      </header>

      <section class="card__section" aria-labelledby="contact-heading">
        <h2 id="contact-heading" class="card__section-title">Contato</h2>
        <ul class="card__contact-list">
          <li class="card__contact-item">
            <span class="card__contact-icon" id="icon-email" aria-hidden="true"></span>
            <a id="email" href="mailto:" class="card__contact-row"></a>
          </li>
          <li class="card__contact-item">
            <span class="card__contact-icon" id="icon-phone" aria-hidden="true"></span>
            <a id="phone" href="tel:" class="card__contact-row"></a>
          </li>
          <li class="card__contact-item">
            <span class="card__contact-icon" id="icon-website" aria-hidden="true"></span>
            <a id="website" href="#" class="card__contact-row" target="_blank" rel="noopener noreferrer"></a>
          </li>
        </ul>
      </section>

      <section class="card__section" aria-labelledby="social-heading">
        <h2 id="social-heading" class="card__section-title">Redes</h2>
        <ul class="card__social-list">
          <li class="card__social-item">
            <a id="linkedin" href="#" class="card__social-link" aria-label="LinkedIn" target="_blank" rel="noopener noreferrer"></a>
          </li>
          <li class="card__social-item">
            <a id="github" href="#" class="card__social-link" aria-label="GitHub" target="_blank" rel="noopener noreferrer"></a>
          </li>
          <li class="card__social-item">
            <a id="whatsapp" href="#" class="card__social-link" aria-label="WhatsApp" target="_blank" rel="noopener noreferrer"></a>
          </li>
        </ul>
      </section>

      <footer class="card__footer">
        <button id="download-vcard" class="card__download" type="button" aria-label="Baixar arquivo vCard">
          <span class="card__download-icon" id="icon-download" aria-hidden="true"></span>
          Baixar vCard
        </button>
      </footer>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
